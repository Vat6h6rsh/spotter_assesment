<!doctype html>
<html lang="en" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.dataset.density = matchMedia("(min-width: 1024px) and (pointer: fine)").matches ? "compact" : "comfortable";
      // Set the saved family before styles paint; main waits for its glyphs before mounting.
      try {
        const font = localStorage.getItem("spotter.font.v05");
        document.documentElement.dataset.font = ["plex", "atkinson", "manrope", "source"].includes(font) ? font : "plex";
      } catch {
        document.documentElement.dataset.font = "plex";
      }
    </script>
    <!-- Spotter's own favicon set, fetched from spotter.ai for this Spotter take-home. -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172E3C" />
    <meta name="description" content="Look ahead. Compare truck routes, forecast weather and planned rests in one clear view." />
    <title>Weather Route · Spotter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
